name: Build and test
on: [push, pull_request]
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          path: alloy
      - uses: actions/checkout@v4
        with:
          repository: eddix/gpui-rhai
          ref: d87ebb9f781ecaaa53e265d39b9cacc7ded07f25
          path: gpui-rhai
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: alloy
      - run: sh scripts/prepare-dependency.sh
        working-directory: alloy
      - run: cargo fmt --check && cargo test --locked && cargo clippy --locked --all-targets -- -D warnings
        working-directory: alloy
      - run: cargo run --locked -- --check
        working-directory: alloy
