name: Release macOS packages

on:
  push:
    tags: ['v*', 'V*', '[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: alloy
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      RELEASE_ARCH: ${{ matrix.arch }}
      ALLOY_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: alloy
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: eddix/gpui-rhai
          ref: d87ebb9f781ecaaa53e265d39b9cacc7ded07f25
          path: gpui-rhai
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: alloy
          key: release-${{ matrix.arch }}
      - name: Test native update restart guard
        run: sh scripts/test-updater.sh
      - name: Build release app
        run: |
          version=$(python3 scripts/bundle-info.py --version "$RELEASE_TAG")
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          sh scripts/package.sh release "$version"
      - name: Archive app
        run: |
          mkdir -p release-assets
          archive="Alloy-${RELEASE_VERSION}-macOS-${RELEASE_ARCH}.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/Alloy.app "release-assets/$archive"
          (cd release-assets && shasum -a 256 "$archive" > "$archive.sha256")
      - name: Sign update archive and appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "Configure the repository SPARKLE_PRIVATE_KEY secret before releasing." >&2
            exit 1
          fi
          printf '%s' "$SPARKLE_PRIVATE_KEY" | target/sparkle-sdk/bin/generate_appcast \
            --ed-key-file - \
            --maximum-deltas 0 \
            --download-url-prefix "https://github.com/${ALLOY_UPDATE_REPOSITORY}/releases/download/${RELEASE_TAG}/" \
            -o "release-assets/appcast-${RELEASE_ARCH}.xml" release-assets
          printf '%s' "$SPARKLE_PRIVATE_KEY" | target/sparkle-sdk/bin/sign_update \
            --verify --ed-key-file - "release-assets/appcast-${RELEASE_ARCH}.xml"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: alloy/release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Create release if needed and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          # Publish after both app packages are built.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "Alloy $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
      - name: Notify Feishu of published release
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        shell: python
        run: |
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          webhook = os.environ.get("FEISHU_WEBHOOK_URL")
          if not webhook:
              raise SystemExit("Configure the repository FEISHU_WEBHOOK_URL secret before releasing.")

          server = os.environ["GITHUB_SERVER_URL"]
          repository = os.environ["GITHUB_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          release_url = f"{server}/{repository}/releases/tag/{urllib.parse.quote(tag, safe='')}"
          run_url = f"{server}/{repository}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          payload = {
              "msg_type": "text",
              "content": {
                  "text": (
                      f"Alloy 新版本 {tag} 已编译并发布成功\n"
                      "支持 macOS Apple Silicon（arm64）和 Intel（x86_64）\n"
                      f"下载地址：{release_url}\n"
                      f"构建记录：{run_url}"
                  )
              },
          }
          request = urllib.request.Request(
              webhook,
              data=json.dumps(payload, ensure_ascii=False).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
          except (urllib.error.URLError, TimeoutError, ValueError):
              raise SystemExit("Feishu notification failed: HTTP, network or invalid JSON response.") from None
          if result.get("code", result.get("StatusCode")) != 0:
              raise SystemExit("Feishu rejected the release notification; check the bot settings.")
          print("Feishu release notification sent.")
