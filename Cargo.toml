[package]
name = "alloy"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A macOS Git workspace with editable diffs and three-way merging"

[features]
default = ["gui"]
gui = ["dep:gpui-rhai", "dep:gpui-rhai-registry", "dep:semver"]

[dependencies]
gpui-rhai = { path = "../gpui-rhai/crates/gpui-rhai", optional = true }
gpui-rhai-registry = { path = "../gpui-rhai/registry", optional = true }
semver = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1.3"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
similar = "=3.2.0"
tempfile = "3"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
sha2 = "0.10"
notify = "8.2.0"

[[bin]]
name = "alloy"
path = "src/main.rs"
required-features = ["gui"]

[profile.dev]
debug = 0

[profile.release]
strip = true
lto = "thin"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
